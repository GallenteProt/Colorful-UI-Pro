# factory-automation: 828c22a4-904d-4141-9406-711d423517b0
name: Droid Code Review
"on":
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # A repository without FACTORY_API_KEY used to fail the droid-action step, which turned
      # every pull request red for a reason unrelated to the code. GitHub does not allow the
      # secrets context in a job-level `if`, so the key is checked in a step that gates the rest
      # — the same shape release.yml uses for KEYSTORE_BASE64.
      - name: Check for the Factory API key
        id: gate
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          if [ -z "$FACTORY_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Droid Code Review skipped::FACTORY_API_KEY is not set for this repository, so the review cannot run."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - name: Run Factory droid-action
        if: steps.gate.outputs.enabled == 'true'
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_depth: deep
          review_model: gpt-6.2-sol
          reasoning_effort: medium
